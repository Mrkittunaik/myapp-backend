<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nearby admin</title>
<style>body{font:15px system-ui,sans-serif;margin:0;background:#f6f5fb;color:#15152b}header{background:#1b1b4b;color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{flex:1}main{max-width:900px;margin:0 auto;padding:16px}.card{background:#fff;border-radius:6px;padding:14px;margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap;box-shadow:0 1px 6px #0001}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph img{width:84px;height:84px;object-fit:cover;border-radius:4px}.info{flex:1;min-width:220px}button,input{font:inherit;padding:8px 12px;border-radius:5px;border:1px solid #ccc}
button{cursor:pointer;background:#6c4df6;color:#fff;border:0}button.r{background:#d9455f}button.g{background:#eee;color:#222}.tag{display:inline-block;background:#fde7ec;color:#a42;padding:2px 8px;border-radius:4px;margin:2px 4px 2px 0;font-size:13px}.ban{background:#d9455f;color:#fff}</style></head>
<body><header><b>Nearby admin</b><input id="tok" type="password" placeholder="Admin token" size="22"><button id="go">Open</button><input id="q" placeholder="Search name or email"><button id="find" class="g">Search</button><button id="rep" class="g">Reported</button><button id="posts" class="g">Help posts</button></header>
<main><p id="stat"></p><div id="list"></div></main><script src="/admin/panel.js"></script></body></html>
